{% extends "core/base.html" %}
{% block title %}Créer un compte{% endblock %}
{% block content %}
<h1>Créer un nouveau compte</h1>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">S'inscrire</button>
</form>
<p>Déjà un compte ? <a href="{% url 'login' %}">Se connecter</a></p>
{% endblock %}
